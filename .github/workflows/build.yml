# Builds AssaultCube on Linux and macOS for every push and pull request:
# - Linux: CMake and the Makefile (client, server, master), clang and g++; the GPU backend's SPIR-V shaders and a
#   Vulkan run on Mesa lavapipe; a timedemo whose frames are compared between runs and between OpenGL and Vulkan; the
#   x86_64 AppImage (uploaded as an artifact)
# - Windows: the Visual Studio project (MSBuild), and a MinGW-w64 cross-build on Linux
# - macOS: CMake against Homebrew, and the universal, self-contained AssaultCube.app (uploaded as an artifact)
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config clang \
            libopenal-dev libvorbis-dev zlib1g-dev libx11-dev libgl-dev \
            libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libegl-dev libdrm-dev libgbm-dev libvulkan-dev
      - name: SDL3 (not packaged in Ubuntu 24.04; the pinned release the macOS app uses)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/sdl3.tar.gz" https://github.com/libsdl-org/SDL/releases/download/release-3.4.20/SDL3-3.4.20.tar.gz
          echo "f3bb06f55bed9557227a700af2ea62e49497ebdf58037732a731a5fb3ef8581f  $RUNNER_TEMP/sdl3.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/sdl3.tar.gz" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/SDL3-3.4.20" -B "$RUNNER_TEMP/sdl3-build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSDL_TESTS=OFF -DSDL_TEST_LIBRARY=OFF -DSDL_EXAMPLES=OFF
          cmake --build "$RUNNER_TEMP/sdl3-build"
          sudo cmake --install "$RUNNER_TEMP/sdl3-build"
          sudo ldconfig
      - name: CMake build
        run: |
          if [ "${{ matrix.compiler }}" = clang ]; then export CC=clang CXX=clang++; else export CC=gcc CXX=g++; fi
          cmake -S source -B build -G Ninja
          cmake --build build
      - name: Smoke test
        run: build/ac_client --home="$RUNNER_TEMP/achome" --version
      - name: GPU shaders (gpushaders/ compiles to SPIR-V, every variant validates)
        if: matrix.compiler == 'clang'
        run: |
          sudo apt-get install -y --no-install-recommends glslang-tools spirv-tools
          source/src/gpushaders/build.sh "$RUNNER_TEMP/gfx_sdlgpu_spirv.h"
      - name: Vulkan smoke test (the GPU backend on Mesa lavapipe under Xvfb loads a map and saves a screenshot)
        if: matrix.compiler == 'clang'
        run: |
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers xvfb xauth
          xvfb-run -a -s "-screen 0 1280x800x24" timeout -k 10 120 build/ac_client --gpu --home="$RUNNER_TEMP/vk" --init -t0 -w1280 -h800 \
            --loadmap=ac_desert -e"sleep 5000 [screenshottype 0; screenshot] 1; sleep 7000 [quit] 1"
          grep "renderer: SDL GPU (vulkan)" "$RUNNER_TEMP/vk/clientlog.txt"
          if grep -E "SDL GPU: .*(fail|no SPIR-V|no device)" "$RUNNER_TEMP/vk/clientlog.txt"; then exit 1; fi
          ls "$RUNNER_TEMP"/vk/screenshots/*.bmp
      - name: Timedemo image check (the same demo frames, drawn twice with OpenGL and once with Vulkan, compared)
        if: matrix.compiler == 'clang'
        run: |
          # shellcheck disable=SC2046 # (pkg-config's flags are meant to be split)
          cc -O2 -I source/src $(pkg-config --cflags sdl3) -o source/dev_tools/imgcompare source/dev_tools/imgcompare.c $(pkg-config --libs sdl3) -lm
          # (30 demo seconds with a screenshot every 10: two pairs, at 10 and 20 s. Two runs of the same renderer draw
          # exactly the same frames: every pixel must match. A client that hangs is stopped after 10 minutes.)
          source/dev_tools/timedemo-compare.sh -x -T 600 -w 640 -h 400 -s 30 -t 0 -m 100 -o "$RUNNER_TEMP/timedemo-gl" \
            source/dev_tools/timedemo_ac_desert.dmo "build/ac_client --gl" "build/ac_client --gl"
          source/dev_tools/timedemo-compare.sh -x -T 600 -w 640 -h 400 -s 30 -m 98 -o "$RUNNER_TEMP/timedemo-vulkan" \
            source/dev_tools/timedemo_ac_desert.dmo "build/ac_client --gl" "build/ac_client --gpu"
      - name: Upload the timedemo screenshots (the Windows job compares Direct3D 12 with them)
        if: always() && matrix.compiler == 'clang'
        uses: actions/upload-artifact@v4
        with:
          name: timedemo-linux
          path: ${{ runner.temp }}/timedemo-*
          if-no-files-found: ignore
      - name: AppImage dependencies (built from source; cached until source/linux/build-deps.sh changes)
        if: matrix.compiler == 'clang'
        uses: actions/cache@v4
        with:
          path: |
            source/linux/deps/x86_64
            source/linux/deps/tools-x86_64
          key: appimage-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('source/linux/build-deps.sh') }}
      - name: AppImage (source/linux/make-appimage.sh, run on Mesa llvmpipe under Xvfb)
        if: matrix.compiler == 'clang'
        run: |
          sudo apt-get install -y --no-install-recommends libxtst-dev libdecor-0-dev libdbus-1-dev libudev-dev \
            libibus-1.0-dev libpipewire-0.3-dev libpulse-dev libasound2-dev rsync zip file libgl1-mesa-dri
          source/linux/make-appimage.sh
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a -s "-screen 0 1280x800x24" timeout -k 10 120 source/linux/build/AssaultCube-*.AppImage \
            --home="$RUNNER_TEMP/appimage" --init -t0 -w1280 -h800 \
            --loadmap=ac_desert -e"sleep 5000 [screenshottype 0; screenshot] 1; sleep 7000 [quit] 1"
          grep "Renderer: llvmpipe" "$RUNNER_TEMP/appimage/clientlog.txt"
          ls "$RUNNER_TEMP"/appimage/screenshots/*.bmp
      - uses: actions/upload-artifact@v4
        if: matrix.compiler == 'clang'
        with:
          name: AssaultCube-Linux-x86_64
          path: source/linux/build/AssaultCube-*.AppImage
          if-no-files-found: error
      - name: Makefile build
        run: |
          if [ "${{ matrix.compiler }}" = clang ]; then CXX=clang++; else CXX=g++; fi
          make -C source/src -j"$(nproc)" CXX=$CXX client server master

  windows-mingw:
    # the Windows client and server, cross-built with MinGW-w64 from the repository's Windows headers and libraries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-i686 make
      - name: Cross-build
        run: source/dev_tools/mingw-cross.sh "$RUNNER_TEMP/mingw"

  windows:
    # the Visual Studio project (32-bit), as the Windows releases are built; the runner's Visual Studio 2022 builds it
    # with its own toolset instead of the project's (2019). Then the GPU backend on Direct3D 12 (the runner's software
    # adapter, WARP), compared with the same demo frames drawn by OpenGL in the Linux job.
    needs: linux
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build the client and the server
        run: |
          msbuild source\vcpp\assaultcube.sln /m /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143
          msbuild source\vcpp\assaultcube.sln /m /p:Configuration=Standalone /p:Platform=Win32 /p:PlatformToolset=v143
      - name: OpenAL (players get it from the installer; here the bundled OpenAL Soft, as bin_win32/readme_OpenAL.txt says)
        shell: bash
        run: cp bin_win32/openal32_RemoveThisPartToUseOpenAL-Soft.dll bin_win32/OpenAL32.dll
      - name: Smoke test
        shell: pwsh
        run: |
          # (a Windows GUI program: piping its output makes PowerShell wait for it)
          $v = & bin_win32\ac_client.exe --home="$env:RUNNER_TEMP\achome" --version | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "client version: $v"
          if (-not (Test-Path bin_win32\ac_server.exe)) { exit 1 }
      - name: Direct3D 12 timedemo (the same demo frames as the Linux job's, at 640x400)
        shell: bash
        env:
          SDL_GPU_DRIVER: direct3d12
        run: |
          home="$RUNNER_TEMP/d3d12"
          mkdir -p "$home/config" "$home/demos"
          cp source/dev_tools/timedemo_ac_desert.dmo "$home/demos/"
          printf "autodownload 0\naudio 0\nfullscreen 0\nscr_w 640\nscr_h 400\nvsync 0\nscreenshottype 2\n" > "$home/config/init.cfg"
          printf "onTimedemoEnd = [ quit ]\nmapstartonce = []\n" > "$home/config/autoexec.cfg"
          timeout -k 10 600 bin_win32/ac_client.exe --gpu --home="$home" --init -t0 -w640 -h400 -v0 \
            "-emaxfps 0; showstats 0; consize 0; hidehudmsgs 1; timedemo timedemo_ac_desert 30 10" | cat
          grep -E "renderer: SDL GPU|timedemo:" "$home/clientlog.txt"
          grep -q "renderer: SDL GPU (direct3d12)" "$home/clientlog.txt"
          if grep -E "SDL GPU: .*(fail|no DXBC|no device)" "$home/clientlog.txt"; then exit 1; fi
          ls "$home"/screenshots/timedemo_*.png
      - uses: actions/download-artifact@v4
        with:
          name: timedemo-linux
          path: ${{ runner.temp }}/linux
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Compare Direct3D 12 with OpenGL (Linux)
        shell: bash
        run: |
          cl -nologo -O2 -I source/src -I source/include source/dev_tools/imgcompare.c source/lib/SDL3.lib -Fe:imgcompare.exe
          export PATH="$PWD/bin_win32:$PATH"
          n=0
          for a in "$RUNNER_TEMP"/linux/timedemo-gl/a/screenshots/timedemo_*.png; do
            f=$(basename "$a")
            printf "%s: " "$f"
            ./imgcompare.exe "$a" "$RUNNER_TEMP/d3d12/screenshots/$f" 8 90
            n=$((n + 1))
          done
          [ $n -gt 0 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AssaultCube-Windows
          path: |
            bin_win32/*.exe
            bin_win32/*.dll
            ${{ runner.temp }}/d3d12/screenshots
            ${{ runner.temp }}/d3d12/clientlog.txt

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install sdl3 libvorbis
      - name: CMake build (Homebrew libraries)
        run: |
          cmake -S source -B build
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          build/ac_client --home="$RUNNER_TEMP/achome" --version
      - name: Universal app bundle
        run: source/macos/make-app.sh --dmg
      - uses: actions/upload-artifact@v4
        with:
          name: AssaultCube-macOS
          path: source/macos/build/AssaultCube-*-macOS.dmg
          if-no-files-found: error
